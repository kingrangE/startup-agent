name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --editable ".[dev]"
      - run: python -m pytest -q
      - run: python -m separk.benchmarks.hallucination
      - run: python -m build
      - name: CLI smoke tests
        run: |
          separk --help
          separk-agent --help
          separk-evals --help
